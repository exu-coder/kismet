# Kismet Supabase project config (for local dev / CLI deploys)
project_id = "xjckwcvwssuadqkxgumt"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Anonymous-only product: every visitor gets a secure anonymous Supabase user.
# The same switch must be enabled in Dashboard → Authentication → Sign In / Providers.
enable_anonymous_sign_ins = true
site_url = "https://kissmeet.pages.dev"
additional_redirect_urls = ["https://kissmeet.pages.dev/**", "https://*.kissmeet.pages.dev/**", "http://localhost:3000/**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "50MiB"

[functions.matchmake]
verify_jwt = true

[functions.session]
# The caller has no session yet. The function creates one, rate-limited.
verify_jwt = false
