<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kismet — profile</title>
  <meta name="theme-color" content="#070a14" />
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://kissmeet.pages.dev/profile" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" href="/favicon.png" type="image/png" />
  <link rel="stylesheet" href="/redesign/theme.css">
  <script src="/redesign/pixels.js" defer></script>
  <script src="/redesign/nav.js" defer></script>
  <script src="/redesign/toast.js" defer></script>
  <script src="/redesign/supabase.min.js" defer></script>
  <script src="/redesign/supabase.js" defer></script>
  <script src="/redesign/profile.js" defer></script>
	</head>
<body>
  <div class="shell full-bleed">
    <header>
      <a class="lockup" href="/">
        <span class="mark-tube neon-whole"><svg viewBox="0 0 100 100" role="presentation" aria-hidden="true" style="width:1.12em;height:1.12em;"><defs><linearGradient id="mark-warp" gradientUnits="userSpaceOnUse" x1="8" y1="12" x2="92" y2="88"><stop offset="0" style="stop-color: color-mix(in srgb, #f59e0b calc(var(--lit, 1) * 100%), var(--neon-off, #191430))"></stop><stop offset="1" style="stop-color: color-mix(in srgb, #f59e0b calc(var(--lit, 1) * 100%), var(--neon-off, #191430))"></stop></linearGradient></defs><rect x="6" y="17" width="88" height="66" rx="14" fill="url(#mark-warp)"></rect><g fill="none" stroke="#140e22"><circle cx="46" cy="50" r="22" stroke-width="5.5"></circle><circle cx="49" cy="49" r="11.5" stroke-width="4.5"></circle></g><circle cx="51.5" cy="48.25" r="3.75" fill="#140e22"></circle></svg></span>
        <span class="wordmark neon-sign">Kis<em>met</em></span>
      </a>
    </header>
    <main>
      <div class="content" style="max-width:52rem;margin:0 auto;padding:2rem 1.5rem 6rem;">
        <h1 style="font-size:clamp(1.8rem,4vw,2.6rem);margin:0 0 1.5rem;">Profile</h1>
        <div style="display:flex;flex-direction:column;align-items:center;gap:1rem;margin-bottom:2rem;">
          <label id="photo-wrap" style="width:8rem;height:8rem;border:2px dashed var(--color-primary,#f59e0b);overflow:hidden;display:grid;place-items:center;background:var(--color-bg-container,#0c101f);cursor:pointer;position:relative;border-radius:50%;" title="Click to upload photo">
            <span id="photo-placeholder" style="font-size:2.5rem;color:var(--color-text-faint,#8e8aa2)">+</span>
            <img id="photo-img" style="width:100%;height:100%;object-fit:cover;display:none;" />
            <span id="photo-overlay" style="position:absolute;bottom:0;left:0;right:0;padding:.3rem;background:rgba(0,0,0,.6);color:#fff;font-size:.65rem;text-align:center;">Tap to upload</span>
          </label>
          <input type="file" id="photo-input" accept="image/*" style="display:none;" />
          <div style="display:flex;gap:.5rem;">
            <label class="ka-btn" style="cursor:pointer;display:inline-block;">
              Choose photo
              <input type="file" id="photo-input2" accept="image/*" style="display:none;" />
            </label>
            <button class="ka-btn ghost" id="remove-photo">Remove</button>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:.75rem;">
          <div>
            <label style="font-size:.8rem;color:var(--color-text-light,#b6b1c4);display:block;margin-bottom:.3rem;">Display name</label>
            <input id="name-input" class="ka-input" placeholder="Your name" />
          </div>
          <div>
            <label style="font-size:.8rem;color:var(--color-text-light,#b6b1c4);display:block;margin-bottom:.3rem;">Country</label>
            <select id="country-select" class="ka-input">
              <option value="">Select country</option>
            </select>
          </div>
          <div>
            <label style="font-size:.8rem;color:var(--color-text-light,#b6b1c4);display:block;margin-bottom:.3rem;">Friend code</label>
            <div id="code-display" style="font-family:var(--font-mono,monospace);font-size:.9rem;color:var(--color-primary,#f59e0b);padding:.4rem;background:var(--color-bg-container,#0c101f);border:1px dashed var(--color-primary,#f59e0b);text-align:center;"></div>
          </div>
          <div style="padding:.75rem;background:var(--color-bg-container,#0c101f);border:1px solid var(--color-border,#232b47);border-left:3px solid var(--color-primary,#f59e0b);">
            <div style="font-weight:700;font-size:.85rem;margin-bottom:.3rem;color:var(--color-text,#efe8d6)">Anonymous by default</div>
            <div style="font-size:.8rem;color:var(--color-text-light,#b6b1c4);line-height:1.5;">Your identity is hidden in every call. A "Reveal identity" button appears during a live call — tap it to let the stranger see your name and send a friend request. Until you reveal, the conversation ends when the call ends.</div>
          </div>
          <button class="ka-btn" id="save-btn" style="margin-top:.5rem;">Save profile</button>
        </div>
        <div style="margin-top:1.5rem;padding:1rem;background:var(--color-bg-container,#0c101f);border:1px solid var(--color-border,#232b47);">
          <div style="font-weight:700;margin-bottom:.5rem;color:var(--color-text,#efe8d6)">Stats</div>
          <div style="display:flex;justify-content:space-between;padding:.3rem 0;font-size:.85rem;"><span style="color:var(--color-text-light,#b6b1c4)">Friends</span><span id="stat-friends" style="color:var(--color-text,#efe8d6);font-weight:600">0</span></div>
          <div style="display:flex;justify-content:space-between;padding:.3rem 0;font-size:.85rem;"><span style="color:var(--color-text-light,#b6b1c4)">Pending requests</span><span id="stat-reqs" style="color:var(--color-text,#efe8d6);font-weight:600">0</span></div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
