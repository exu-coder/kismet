<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kismet — chat</title>
  <meta name="theme-color" content="#070a14" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" href="/logo.png" type="image/png" />
  <link rel="stylesheet" href="/redesign/theme.css">
  <script src="/redesign/pixels.js" defer></script>
  <script src="/redesign/nav.js" defer></script>
  <script src="/redesign/inbox.js" defer></script>
		<script src="/redesign/toast.js" defer></script>
			<script src="/redesign/supabase.js" defer></script>
	</head>
<body>
  <div class="shell full-bleed">
    <header>
      <a class="lockup" href="/">
        <span class="mark-tube neon-whole"><svg viewBox="0 0 100 100" role="presentation" aria-hidden="true" style="width:1.12em;height:1.12em;"><defs><linearGradient id="mark-warp" gradientUnits="userSpaceOnUse" x1="8" y1="12" x2="92" y2="88"><stop offset="0" style="stop-color: color-mix(in srgb, #f59e0b calc(var(--lit, 1) * 100%), var(--neon-off, #191430))"></stop><stop offset="1" style="stop-color: color-mix(in srgb, #f59e0b calc(var(--lit, 1) * 100%), var(--neon-off, #191430))"></stop></linearGradient></defs><rect x="6" y="17" width="88" height="66" rx="14" fill="url(#mark-warp)"></rect><g fill="none" stroke="#140e22"><circle cx="46" cy="50" r="22" stroke-width="5.5"></circle><circle cx="49" cy="49" r="11.5" stroke-width="4.5"></circle></g><circle cx="51.5" cy="48.25" r="3.75" fill="#140e22"></circle></svg></span>
        <span class="wordmark neon-sign">Kis<em>met</em></span>
      </a>
    </header>
    <main>
      <div class="content" style="max-width:52rem;margin:0 auto;padding:2rem 1.5rem 6rem;">
        <h1 style="font-size:clamp(1.8rem,4vw,2.6rem);margin:0 0 1.5rem;">Chat</h1>
        <div id="inbox-list"></div>
        <div id="chat-view" style="display:none;">
          <button id="back-btn" class="ka-btn ghost" style="margin-bottom:.75rem;">← Back</button>
          <div id="chat-name" style="font-weight:700;font-size:1.1rem;margin-bottom:.5rem;color:var(--color-text,#efe8d6)"></div>
          <div id="messages" style="min-height:12rem;max-height:40vh;overflow-y:auto;display:flex;flex-direction:column;gap:.4rem;padding:.5rem 0;border:1px solid var(--color-border,#232b47);padding:.75rem;margin-bottom:.5rem;background:var(--color-bg-container,#0c101f)"></div>
          <div style="display:flex;gap:.4rem;">
            <input id="msg-input" class="ka-input" placeholder="Type a message…" style="flex:1;" />
            <button id="send-btn" class="ka-btn">Send</button>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
